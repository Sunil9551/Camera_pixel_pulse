name: Mobile Android Java Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. कोड डाउनलोड करें
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. जावा सेटअप करें
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. बिना gradlew के सीधे ग्लोबल ग्रैडल से ऐप बिल्ड करें
      - name: Build Debug APK with Global Gradle
        run: gradle assembleDebug

      # 4. तैयार APK को अपलोड करें
      - name: Upload Camera App APK
        uses: actions/upload-artifact@v4
        with:
          name: Camera-App-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

